name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The conformance tests of confine skip, rather than fail, where the
      # sandbox cannot run, so make sure it can.
      - if: runner.os == 'macOS'
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)' -- /usr/bin/true
      - if: runner.os == 'Linux'
        run: cargo build && cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/target/debug/confine" -d . true
      - run: cargo test
